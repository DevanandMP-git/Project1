<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="A little hello from the internet.">
  <title>Hello, world! — a little moment of magic</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f3ff;
      --muted: #a5a4bd;
      --violet: #a78bfa;
      --pink: #f0abfc;
      --mint: #a7f3d0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2rem;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(100, 72, 174, .2), transparent 42%),
        radial-gradient(ellipse at 12% 90%, rgba(35, 153, 140, .12), transparent 34%),
        #090b16;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image: radial-gradient(1px 1px at 18% 22%, #fff 98%, transparent),
                        radial-gradient(1px 1px at 76% 18%, #c4b5fd 98%, transparent),
                        radial-gradient(1.5px 1.5px at 87% 73%, #fff 98%, transparent),
                        radial-gradient(1px 1px at 31% 81%, #f0abfc 98%, transparent),
                        radial-gradient(1px 1px at 61% 91%, #fff 98%, transparent);
      background-size: 390px 340px;
      opacity: .55;
      animation: drift 26s linear infinite;
    }
    .stars::before { transform: translateY(-100%); }
    .stars::after { opacity: .25; background-size: 270px 230px; animation-duration: 38s; }
    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: 0 32px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }
    .site-nav { position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: .35rem; }
    .site-nav a { padding: .6rem .85rem; border: 1px solid transparent; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: .82rem; transition: color .2s, background .2s, border-color .2s; }
    .site-nav a:hover, .site-nav a:focus-visible { color: var(--ink); border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.06); outline: none; }
    .sparkle {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin: 0 auto 2rem;
      border: 1px solid rgba(196,181,253,.32);
      border-radius: 22px;
      color: #ddd6fe;
      background: linear-gradient(145deg, rgba(167,139,250,.22), rgba(240,171,252,.1));
      box-shadow: 0 0 42px rgba(167,139,250,.2);
      font-size: 1.8rem;
      animation: glow 3s ease-in-out infinite;
    }
    .eyebrow {
      margin: 0 0 1.15rem;
      color: var(--mint);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 6.8rem);
      font-weight: 760;
      letter-spacing: -.075em;
      line-height: .98;
    }
    h1 span {
      display: block;
      padding: .08em .03em .16em;
      color: transparent;
      background: linear-gradient(100deg, #fff 9%, #c4b5fd 45%, #f0abfc 78%, #a7f3d0);
      background-clip: text;
      -webkit-background-clip: text;
    }
    .message {
      max-width: 420px;
      margin: 1.6rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.8;
    }
    .signature {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2.5rem;
      padding: .7rem 1rem;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      color: #dedcf0;
      background: rgba(255,255,255,.035);
      font-size: .82rem;
    }
    .signature i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px var(--mint);
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translateY(100%); } }
    @keyframes glow { 50% { box-shadow: 0 0 58px rgba(167,139,250,.34); transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="gallery.html">Gallery</a>
    </nav>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little moment on the web</p>
    <h1>Hello,<span>world!</span></h1>
    <p class="message">A fresh page, a little sparkle, and a friendly hello. Here’s to all the lovely things you’ll make next.</p>
    <div class="signature"><i aria-hidden="true"></i> Made with a little magic</div>
  </main>
</body>
</html>
